<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>观势</title>
    <meta name="description" content="以易经卦象观察当下处境与下一步行动姿态。" />
    <style>
      * { box-sizing: border-box; }
      :root {
        --paper: #f7f3eb;
        --ink: #211d18;
        --muted: #665b4e;
        --red: #8b2f28;
        --green: #31584b;
        --gold: #f0d59d;
        --dark: #242017;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      button, textarea { font: inherit; }
      button { cursor: pointer; }
      .hero {
        min-height: 88vh;
        padding: 28px clamp(18px, 4vw, 64px) 42px;
        background:
          linear-gradient(120deg, rgba(142, 39, 32, 0.1), transparent 36%),
          radial-gradient(circle at 82% 14%, rgba(34, 97, 78, 0.18), transparent 30%),
          var(--paper);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(1120px, 100%);
        margin: 0 auto 46px;
        color: #393025;
        font-size: 16px;
        font-weight: 650;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(74, 57, 38, 0.28);
        border-radius: 50%;
        background: #fffaf1;
        color: var(--red);
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.72fr);
        gap: clamp(24px, 5vw, 72px);
        align-items: center;
        width: min(1120px, 100%);
        margin: 0 auto;
      }
      .eyebrow {
        margin: 0 0 18px;
        color: var(--red);
        font-size: 14px;
        font-weight: 750;
      }
      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(42px, 7vw, 86px);
        line-height: 1.02;
        letter-spacing: 0;
        color: #221b14;
      }
      .lead {
        max-width: 650px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(17px, 2vw, 21px);
        line-height: 1.75;
      }
      .form {
        max-width: 680px;
        margin-top: 34px;
        padding: 18px;
        border: 1px solid rgba(76, 60, 42, 0.2);
        border-radius: 8px;
        background: rgba(255, 250, 241, 0.78);
        box-shadow: 0 22px 55px rgba(50, 37, 22, 0.1);
      }
      label {
        display: block;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }
      textarea {
        width: 100%;
        min-height: 116px;
        resize: vertical;
        border: 1px solid rgba(75, 57, 38, 0.2);
        border-radius: 8px;
        outline: none;
        background: #fffdf8;
        color: #241e17;
        padding: 15px 16px;
        line-height: 1.7;
      }
      textarea:focus {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(139, 47, 40, 0.13);
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 14px;
      }
      .cast {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 118px;
        min-height: 46px;
        border: 0;
        border-radius: 8px;
        background: var(--red);
        color: #fffaf1;
        font-weight: 750;
      }
      .cast:hover { background: #722820; }
      .actions small {
        color: #7d7165;
        font-size: 13px;
        line-height: 1.5;
      }
      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
      .examples button {
        border: 1px solid rgba(65, 78, 64, 0.22);
        border-radius: 999px;
        background: rgba(255, 250, 241, 0.58);
        color: var(--green);
        padding: 9px 13px;
        font-size: 13px;
      }
      .oracle {
        border: 1px solid rgba(65, 48, 32, 0.18);
        border-radius: 8px;
        background: var(--dark);
        color: #fff8ea;
        padding: clamp(22px, 4vw, 34px);
        box-shadow: 0 28px 80px rgba(34, 27, 19, 0.25);
      }
      .oracle-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
      }
      .oracle-head p, .question-card p {
        margin: 0 0 8px;
        color: #d2b990;
        font-size: 13px;
        font-weight: 750;
      }
      .oracle h2 {
        margin: 0;
        font-size: clamp(30px, 4vw, 44px);
        font-weight: 750;
        letter-spacing: 0;
      }
      .posture {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border: 1px solid rgba(246, 220, 171, 0.34);
        border-radius: 50%;
        color: var(--gold);
        font-size: 28px;
        font-weight: 800;
      }
      .hexagram {
        display: grid;
        gap: 13px;
        width: min(280px, 100%);
        margin: 42px auto 36px;
      }
      .hex-line {
        display: grid;
        grid-template-columns: 1fr 34px;
        align-items: center;
        gap: 12px;
        min-height: 18px;
      }
      .solid, .broken { display: flex; align-items: center; height: 16px; }
      .solid::before, .broken::before, .broken::after {
        content: "";
        display: block;
        height: 12px;
        border-radius: 2px;
        background: var(--gold);
      }
      .solid::before { width: 100%; }
      .broken { justify-content: space-between; }
      .broken::before, .broken::after { width: 42%; }
      .hex-line b { color: #d87851; font-size: 13px; }
      .phrase {
        margin: 0;
        color: #f4e2bd;
        font-size: 20px;
        line-height: 1.55;
      }
      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 24px;
      }
      .meta span {
        border: 1px solid rgba(246, 220, 171, 0.22);
        border-radius: 8px;
        color: #dbc79f;
        padding: 12px;
        font-size: 14px;
      }
      .reading {
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: 10px clamp(18px, 4vw, 64px) 64px;
      }
      .question-card {
        margin-bottom: 20px;
        border-left: 4px solid var(--red);
        padding: 4px 0 4px 18px;
      }
      .question-card h2 {
        margin: 0;
        color: #272017;
        font-size: clamp(22px, 3vw, 34px);
        line-height: 1.35;
        letter-spacing: 0;
      }
      .reading-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      article {
        min-height: 258px;
        border: 1px solid rgba(82, 63, 42, 0.18);
        border-radius: 8px;
        background: #fffaf1;
        padding: 20px;
      }
      article span {
        color: var(--red);
        font-size: 13px;
        font-weight: 750;
      }
      article h3 {
        margin: 10px 0 12px;
        color: #2d251c;
        font-size: 22px;
        letter-spacing: 0;
      }
      article p, article li {
        color: #60564b;
        font-size: 15px;
        line-height: 1.72;
      }
      article ul { margin: 0; padding-left: 18px; }
      @media (max-width: 920px) {
        .grid, .reading-grid { grid-template-columns: 1fr; }
        .hero { min-height: auto; }
        .oracle { max-width: 560px; }
      }
      @media (max-width: 620px) {
        .brand { margin-bottom: 30px; }
        h1 { font-size: 42px; }
        .actions { align-items: stretch; flex-direction: column; }
        .cast { width: 100%; }
        .meta { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="brand"><span class="brand-mark">觀</span><span>观势</span></div>
        <div class="grid">
          <section>
            <p class="eyebrow">以易观时位</p>
            <h1>把当下的问题，化成一卦一策。</h1>
            <p class="lead">输入一个真实困惑，观势会生成本卦与变卦，帮你看见当前局面、变化趋势，以及下一步更合适的行动姿态。</p>
            <form class="form" id="questionForm">
              <label for="question">所问之事</label>
              <textarea id="question" rows="4" placeholder="比如：我现在该不该换工作？">我现在这个想法适不适合开始做？</textarea>
              <div class="actions">
                <button class="cast" type="submit"><span>起卦</span><span aria-hidden="true">◎</span></button>
                <small>用于反思与灵感启发，不替代专业建议。</small>
              </div>
            </form>
            <div class="examples" aria-label="示例问题">
              <button type="button">我现在要不要主动推进这个机会？</button>
              <button type="button">这段关系下一步适合靠近还是退一点？</button>
              <button type="button">这个项目现在最该先补哪一环？</button>
            </div>
          </section>
          <aside class="oracle" aria-label="卦象结果">
            <div class="oracle-head">
              <div><p>本卦</p><h2 id="baseName">水雷屯</h2></div>
              <div class="posture" id="posture">观</div>
            </div>
            <div class="hexagram" id="hexagram"></div>
            <p class="phrase" id="phrase">初生多阻，宜先立根。</p>
            <div class="meta"><span id="changedCount">变爻 0</span><span id="changedName">变卦 水雷屯</span></div>
          </aside>
        </div>
      </section>
      <section class="reading" aria-label="解读结果">
        <div class="question-card"><p>你问</p><h2 id="asked">我现在这个想法适不适合开始做？</h2></div>
        <div class="reading-grid">
          <article><span>当前状态</span><h3 id="stateTitle">水雷屯</h3><p id="stateText"></p></article>
          <article><span>变化趋势</span><h3 id="trendTitle">火水未济</h3><p id="trendText"></p></article>
          <article><span>行动姿态</span><h3 id="adviceTitle">观</h3><ul id="adviceList"></ul></article>
          <article><span>不宜</span><h3>留一分余地</h3><p id="avoidText"></p></article>
        </div>
      </section>
    </main>
    <script>
      const hexagrams = [
        { id: 1, name: "乾为天", pattern: "111111", phrase: "势在上升，贵在守正。", state: "当下有强烈的主动性和开创力，局面正在向外展开。真正的关键不是敢不敢动，而是能不能让行动保持节制和方向。", trend: "如果继续推进，机会会被打开，但节奏过猛也容易让你忽略边界。", advice: ["主动争取关键位置", "把目标拆成可验证的一步", "用规则约束自己的冲劲"], avoid: "避免只凭热情硬冲，也避免把所有压力都扛在自己身上。", keywords: ["开创", "主动", "领导", "自强"] },
        { id: 2, name: "坤为地", pattern: "000000", phrase: "厚德载物，先承后成。", state: "当前更适合接住现实、整理资源、等待条件成熟。它不是软弱，而是用承载力换取稳定。", trend: "局势会通过积累而变化，越急着证明自己，越容易打乱已经形成的底盘。", advice: ["先把身边资源盘清", "配合更大的节奏", "用稳定兑现信任"], avoid: "避免过早站到台前，也避免把退让误解成没有选择。", keywords: ["承载", "顺势", "积累", "稳定"] },
        { id: 3, name: "水雷屯", pattern: "100010", phrase: "初生多阻，宜先立根。", state: "事情处在刚开始的混沌期，有生机，也有阻力。很多问题不是方向错了，而是秩序还没有长出来。", trend: "下一步会继续遇到摩擦，但每一次整理都会让结构更清楚。", advice: ["先解决最卡住的一环", "找一个可靠的人一起定规则", "允许第一版粗糙但要能运转"], avoid: "避免一开始就追求完美，也避免因为混乱就判断它没有价值。", keywords: ["开始", "混沌", "立规", "破土"] },
        { id: 4, name: "山水蒙", pattern: "010001", phrase: "未知不是错，先求明。", state: "现在最大的变量不是外界，而是信息不足。你可能已经感觉到方向，但还缺少判断它的依据。", trend: "只要愿意学习和请教，局势会逐渐清楚；若急着下结论，容易反复。", advice: ["先提出更准确的问题", "向懂行的人请教", "用一次小实验换答案"], avoid: "避免用情绪填补信息空白，也避免装作已经完全明白。", keywords: ["启蒙", "学习", "请教", "试探"] },
        { id: 11, name: "地天泰", pattern: "111000", phrase: "天地相交，小往大来。", state: "局面有流通感，上下、内外、资源与目标之间正在接上。此时适合推进合作和整合。", trend: "如果能保持开放，事情会从局部顺畅发展为整体顺畅。", advice: ["促成对话与连接", "把已有优势组合起来", "趁顺势推进一件重要事"], avoid: "避免因为顺利就松散，也避免忽略小问题的积累。", keywords: ["通达", "合作", "整合", "顺势"] },
        { id: 12, name: "天地否", pattern: "000111", phrase: "上下不交，宜止而观。", state: "当下有阻隔感，想法、资源或关系没有真正流动起来。越急着推动，越容易撞到看不见的墙。", trend: "短期内不宜硬进，先看清哪里不通，才有重新打开的可能。", advice: ["暂停无效沟通", "识别真正的阻塞点", "保存实力等待转机"], avoid: "避免把沉默当成同意，也避免在对方没准备好时强行推进。", keywords: ["闭塞", "阻隔", "停顿", "观察"] },
        { id: 24, name: "地雷复", pattern: "100000", phrase: "一阳来复，转机已动。", state: "看似低谷，但新的力量已经出现。它还很微弱，需要保护，而不是立刻放大。", trend: "接下来会有回升的迹象，关键是顺着小变化慢慢恢复。", advice: ["从一个可坚持的小行动开始", "修复作息和基本节奏", "不要急着宣布结果"], avoid: "避免刚有转机就过度消耗，也避免否定微小进展。", keywords: ["回归", "复苏", "转机", "小火苗"] },
        { id: 29, name: "坎为水", pattern: "010010", phrase: "险中求信，稳步过坎。", state: "你处在压力、风险或不确定之中。此卦不说马上脱险，而是提醒你在险境中保持清醒和可信。", trend: "困难可能还会反复，但只要不乱，路会在一段一段通过中出现。", advice: ["先确保底线安全", "只处理眼前最真实的问题", "用稳定行动建立信任"], avoid: "避免赌一把式解决，也避免被恐惧带着走。", keywords: ["风险", "坚持", "底线", "穿越"] },
        { id: 52, name: "艮为山", pattern: "001001", phrase: "止于其所，静中见界。", state: "当前更适合停下、定界、收心。停止不是失败，而是让力量回到该在的位置。", trend: "局面会因边界清晰而稳定，暂时不动反而能避免多余消耗。", advice: ["暂停新增承诺", "明确自己的边界", "把注意力收回到当下"], avoid: "避免把所有沉默都理解成错过，也避免为了证明自己而继续消耗。", keywords: ["停止", "边界", "安定", "自守"] },
        { id: 64, name: "火水未济", pattern: "010101", phrase: "未成之际，慎终如始。", state: "事情接近成形，但还没有真正完成。现在最容易因为快到终点而松手。", trend: "下一步有机会完成转化，但细节决定成败。", advice: ["检查最后几个关键环节", "让节奏慢半拍", "把未完成的事逐项收口"], avoid: "避免提前庆祝，也避免因为最后的不确定而全盘否定。", keywords: ["未完成", "收口", "谨慎", "转化"] }
      ];
      const pick = (selector) => document.querySelector(selector);
      const randomLine = () => ["yin", "yang", "old-yin", "old-yang"][Math.floor(Math.random() * 4)];
      const lineToBit = (line) => line === "yang" || line === "old-yang" ? "1" : "0";
      const changedBit = (line) => line === "old-yang" ? "0" : line === "old-yin" ? "1" : lineToBit(line);
      function findHexagram(pattern) {
        const exact = hexagrams.find((hexagram) => hexagram.pattern === pattern);
        if (exact) return exact;
        const seed = pattern.split("").reduce((sum, bit, index) => sum + Number(bit) * (index + 3), 0);
        return hexagrams[seed % hexagrams.length];
      }
      function choosePosture(base, changed, count) {
        if (count === 0) return "守";
        if (base.keywords.includes("阻隔") || base.keywords.includes("风险")) return "稳";
        if (changed.keywords.includes("转机") || changed.keywords.includes("通达")) return "进";
        if (base.keywords.includes("停止")) return "止";
        if (count >= 3) return "变";
        return "观";
      }
      function createReading(question) {
        const lines = Array.from({ length: 6 }, randomLine);
        const base = findHexagram(lines.map(lineToBit).join(""));
        const changed = findHexagram(lines.map(changedBit).join(""));
        const changing = lines.filter((line) => line.includes("old")).length;
        return { question, lines, base, changed, changing, posture: choosePosture(base, changed, changing) };
      }
      function render(reading) {
        pick("#baseName").textContent = reading.base.name;
        pick("#posture").textContent = reading.posture;
        pick("#phrase").textContent = reading.base.phrase;
        pick("#changedCount").textContent = `变爻 ${reading.changing}`;
        pick("#changedName").textContent = `变卦 ${reading.changed.name}`;
        pick("#asked").textContent = reading.question;
        pick("#stateTitle").textContent = reading.base.name;
        pick("#stateText").textContent = reading.base.state;
        pick("#trendTitle").textContent = reading.changed.name;
        pick("#trendText").textContent = reading.changed.trend;
        pick("#adviceTitle").textContent = reading.posture;
        pick("#avoidText").textContent = reading.base.avoid;
        pick("#adviceList").innerHTML = reading.base.advice.map((item) => `<li>${item}</li>`).join("");
        pick("#hexagram").innerHTML = [...reading.lines].reverse().map((line, index) => {
          const isYang = line === "yang" || line === "old-yang";
          const isChanging = line === "old-yin" || line === "old-yang";
          return `<div class="hex-line"><span class="${isYang ? "solid" : "broken"}"></span>${isChanging ? "<b>变</b>" : "<span></span>"}</div>`;
        }).join("");
      }
      document.querySelectorAll(".examples button").forEach((button) => {
        button.addEventListener("click", () => { pick("#question").value = button.textContent; });
      });
      pick("#questionForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const question = pick("#question").value.trim() || "我当下最应该看见什么？";
        render(createReading(question));
      });
      render(createReading(pick("#question").value.trim()));
    </script>
  </body>
</html>
